<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dola Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <img src="icon128.png" class="brand-logo" alt="" width="34" height="34">
                <div class="brand-text">
                    <h1 class="title">Dola Downloader</h1>
                    <span class="subtitle">Watermark-free video saver <span id="app-version" class="version"></span></span>
                </div>
            </div>
            <div class="page-status" id="page-status" data-state="idle" title="Current tab">
                <span class="status-dot"></span>
                <span class="status-text" id="page-status-text">Checking…</span>
            </div>
        </header>

        <!-- Primary Action -->
        <section class="hero">
            <button id="btn-download-screen" class="btn-primary" type="button" data-state="idle">
                <svg class="btn-icon icon-idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
                </svg>
                <svg class="btn-icon icon-busy spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 0 9 9"/>
                </svg>
                <svg class="btn-icon icon-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m5 12.5 4.5 4.5L19 7.5"/>
                </svg>
                <span id="btn-download-screen-text">Download video on screen</span>
            </button>
            <p class="hero-hint" id="hero-hint" aria-live="polite">Saves the latest generated video on this tab in original quality.</p>
        </section>

        <!-- Stats -->
        <section class="stats" aria-label="Download stats">
            <div class="stat">
                <span id="stat-total" class="stat-value">0</span>
                <span class="stat-label">Total saved</span>
            </div>
            <div class="stat">
                <span id="stat-today" class="stat-value">0</span>
                <span class="stat-label">Today</span>
            </div>
            <div class="stat">
                <span id="stat-last" class="stat-value">—</span>
                <span class="stat-label">Last save</span>
            </div>
        </section>

        <!-- Settings -->
        <section class="settings" aria-label="Settings">
            <label class="setting-row" for="dola-auto-download-toggle">
                <svg class="setting-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
                </svg>
                <span class="setting-text">
                    <span class="setting-title">Auto-download</span>
                    <span class="setting-desc">Save every new video as soon as it finishes</span>
                </span>
                <span class="switch">
                    <input id="dola-auto-download-toggle" type="checkbox" role="switch">
                    <span class="slider"></span>
                </span>
            </label>

            <label class="setting-row" for="dola-notifications-toggle">
                <svg class="setting-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
                <span class="setting-text">
                    <span class="setting-title">Desktop notifications</span>
                    <span class="setting-desc">Show an alert after each save</span>
                </span>
                <span class="switch">
                    <input id="dola-notifications-toggle" type="checkbox" role="switch">
                    <span class="slider"></span>
                </span>
            </label>

            <div class="setting-row folder-row">
                <svg class="setting-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
                </svg>
                <span class="setting-text">
                    <label class="setting-title" for="dola-subfolder-input">Save location</label>
                    <span class="folder-field">
                        <span class="folder-prefix">Downloads/</span>
                        <input type="text" id="dola-subfolder-input" class="folder-input" placeholder="Dola_Videos" spellcheck="false" autocomplete="off" maxlength="80">
                        <button id="btn-dola-save-folder" class="btn-link" type="button" hidden>Save</button>
                    </span>
                </span>
            </div>
        </section>

        <!-- History -->
        <section class="history" aria-label="Recent downloads">
            <div class="history-header">
                <h2 class="history-title">Recent downloads <span id="dola-history-count" class="count">0</span></h2>
                <button id="btn-dola-clear-history" class="btn-link danger" type="button" hidden>Clear all</button>
            </div>
            <ul class="history-list" id="dola-history-list"></ul>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                Runs locally in your browser
            </span>
            <button id="btn-open-dola" class="btn-link" type="button">
                Open Dola
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
                </svg>
            </button>
        </footer>

    </main>
    <script src="popup.js"></script>
</body>
</html>
